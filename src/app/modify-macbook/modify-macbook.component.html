<form [formGroup]="macbookForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" appHighlightOnFocus >
  </div>

  <!-- Model Field -->
  <div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" formControlName="model"  appHighlightOnFocus >
  </div>

  <!-- Chip Field -->
  <div class="form-group">
    <label for="chip">Chip</label>
    <input type="text" id="chip" formControlName="chip"  appHighlightOnFocus =""/>
  </div>

  <!-- Color Field -->
  <div class="form-group">
    <label for="color">Color</label>
    <input type="text" id="color" formControlName="color"  appHighlightOnFocus ="green"/>
  </div>

  <!-- Has Owner Checkbox -->
  <div class="form-group">
    <label for="hasOwner">Has Owner</label>
    <input type="checkbox" id="hasOwner" formControlName="hasOwner" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit" class="submit-button" appHoverHighlight="lightblue">ADD/EDIT</button>
  <button type="button" (click)="macbookForm.reset()" appHoverHighlight="lightblue">Reset</button>
  <button type="button" (click)="navigateToMacbookList()" appHoverHighlight="lightblue" >Back to list</button>

  <div *ngIf="error" class="error">{{ error }}</div>


</form>
